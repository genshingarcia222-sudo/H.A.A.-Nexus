[package]
name = "haa-nexus-desktop"
version = "0.1.0"
description = "H.A.A. Nexus desktop application shell"
edition = "2021"
license-file = "../../../LICENSE.md"
# Tauri's MSRV policy is "current stable minus 3" (already 1.83 as of April
# 2025, per tauri-apps/tauri#11205 — track their docs for the current figure
# rather than trusting this comment). This sandbox's only available Rust
# (apt's 1.75.0) is well below that, which is why cargo check fails here on
# transitive edition2024 requirements. Build with rustup's current stable on
# a real machine.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite itself rather than linking a system libsqlite3,
# so the app doesn't depend on whatever SQLite version happens to be
# installed on the user's machine.
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "haa-nexus-desktop"
path = "src/main.rs"

# No [profile.release] on purpose, and this is now a measured decision rather
# than an unexamined default (D16, docs/RELEASE_POLICY.md "Release profile").
#
# Measured on DEVICE-01, rustc 1.98.1, x86_64-pc-windows-msvc, same source:
#
#   Cargo defaults                    10,278,912 bytes
#   strip = true                      10,277,888 bytes   (-1 KB)
#   strip = true, lto = "thin"        10,433,024 bytes   (+150 KB)
#
# strip buys ~1 KB because the MSVC toolchain already puts debug information in
# a separate .pdb, and thin LTO made the executable *larger* through inlining.
# Neither earns a change to what ships. If a future release has a size budget,
# measure again on that code rather than trusting these three numbers.
#
# panic is also left at "unwind" on purpose: `commands.rs` treats a poisoned
# mutex as a recoverable error and returns it to the frontend, and
# panic = "abort" would remove poisoning from the language, making that handling
# unreachable and turning one bad command into a killed application.
